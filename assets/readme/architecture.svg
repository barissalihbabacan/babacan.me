<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">How babacan.me is built and served</title>
  <desc id="desc">Four build stages. Prebuild: fetch-github-data.js writes github-data.json for the personal account and three orgs. Build: vp build bundles src into public. Postbuild: prerender.ts writes one HTML file per route plus sitemap.xml. Deploy: Firebase Hosting serves only static files, with a real 404 status. src/seo.ts is the single metadata source shared by the React app and the prerender step. GitHub Actions deploys main to live and pull requests to a preview channel.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c5a059"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="20" fill="#111214"/>
  <rect x=".75" y=".75" width="1198.5" height="558.5" rx="19.25" fill="none" stroke="#26282d" stroke-width="1.5"/>

  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <line x1="56" y1="66" x2="96" y2="66" stroke="#c5a059" stroke-width="2"/>
    <text x="112" y="72" font-size="18" font-weight="500" letter-spacing="3" fill="#c5a059">BUILD PIPELINE</text>
  </g>

  <!-- asamalar -->
  <g id="stages" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(56 100)">
      <rect width="242" height="210" rx="10" fill="#181a1c" stroke="#33373d" stroke-width="1.5"/>
      <text x="22" y="40" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="18" letter-spacing="2" fill="#c5a059">01 PREBUILD</text>
      <text x="22" y="82" font-size="26" font-weight="600" fill="#f1f3f5">GitHub data</text>
      <text x="22" y="124" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="18" fill="#e5cba3">fetch-github-data</text>
      <text x="22" y="160" font-size="20" fill="#a0a5ab">user + 3 orgs,</text>
      <text x="22" y="188" font-size="20" fill="#a0a5ab">no forks</text>
    </g>
    <g transform="translate(338 100)">
      <rect width="242" height="210" rx="10" fill="#181a1c" stroke="#33373d" stroke-width="1.5"/>
      <text x="22" y="40" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="18" letter-spacing="2" fill="#c5a059">02 BUILD</text>
      <text x="22" y="82" font-size="26" font-weight="600" fill="#f1f3f5">React 19 SPA</text>
      <text x="22" y="124" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="18" fill="#e5cba3">vp build</text>
      <text x="22" y="160" font-size="20" fill="#a0a5ab">src/ bundled</text>
      <text x="22" y="188" font-size="20" fill="#a0a5ab">into public/</text>
    </g>
    <g transform="translate(620 100)">
      <rect width="242" height="210" rx="10" fill="#181a1c" stroke="#33373d" stroke-width="1.5"/>
      <text x="22" y="40" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="18" letter-spacing="2" fill="#c5a059">03 POSTBUILD</text>
      <text x="22" y="82" font-size="26" font-weight="600" fill="#f1f3f5">Prerender</text>
      <text x="22" y="124" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="18" fill="#e5cba3">prerender.ts</text>
      <text x="22" y="160" font-size="20" fill="#a0a5ab">1 HTML per route</text>
      <text x="22" y="188" font-size="20" fill="#a0a5ab">+ sitemap.xml</text>
    </g>
    <g transform="translate(902 100)">
      <rect width="242" height="210" rx="10" fill="#3a2d18" stroke="#c5a059" stroke-width="1.5"/>
      <text x="22" y="40" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="18" letter-spacing="2" fill="#c5a059">04 DEPLOY</text>
      <text x="22" y="82" font-size="26" font-weight="600" fill="#f1f3f5">Firebase</text>
      <text x="22" y="124" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="18" fill="#e5cba3">static hosting</text>
      <text x="22" y="160" font-size="20" fill="#e5cba3" fill-opacity=".8">no SPA rewrite,</text>
      <text x="22" y="188" font-size="20" fill="#e5cba3" fill-opacity=".8">real 404 status</text>
    </g>
  </g>

  <g stroke="#c5a059" stroke-width="2" marker-end="url(#arrow)">
    <line x1="302" y1="205" x2="332" y2="205"/>
    <line x1="584" y1="205" x2="614" y2="205"/>
    <line x1="866" y1="205" x2="896" y2="205"/>
  </g>

  <!-- tek metadata kaynagi -->
  <g id="seo-source">
    <g stroke="#c5a059" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)">
      <path d="M459 392V318"/>
      <path d="M741 392V318"/>
    </g>
    <rect x="338" y="392" width="524" height="84" rx="10" fill="#0d0e10" stroke="#c5a059" stroke-opacity=".5" stroke-width="1.5"/>
    <text x="600" y="426" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="20" fill="#c5a059">src/seo.ts</text>
    <text x="600" y="458" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#a0a5ab">same meta + JSON-LD in both</text>
  </g>

  <text x="56" y="526" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6f747a">GitHub Actions: <tspan fill="#a0a5ab">main</tspan> → live · <tspan fill="#a0a5ab">pull request</tspan> → preview channel</text>
</svg>
