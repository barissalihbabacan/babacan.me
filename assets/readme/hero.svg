  <desc id="desc">Barış Salih Babacan's name in Kingsman Gold styling next to the gold wireframe dodecahedron from the site's hero. Below the name: a bilingual English and Turkish portfolio, a React 19 single-page app prerendered into one static page per route, with example routes /en, /tr, /en/projects/osmos and /tr/projeler/osmos.</desc>
