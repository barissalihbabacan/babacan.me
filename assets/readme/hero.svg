<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">babacan.me — Personal Engineering Portfolio</title>
  <desc id="desc">Hero visual for babacan.me showcasing Kingsman Gold editorial design system, WebGL network topology, React 19, TypeScript, Vite+ toolchain, and Firebase Hosting deployment.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a1c"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#e5cba3"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#26282d" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect width="1200" height="380" rx="12" fill="url(#bgGrad)" stroke="#33373d" stroke-width="1.5"/>
  <rect width="1200" height="380" rx="12" fill="url(#grid)"/>

  <!-- Ghost Number Accent -->
  <text x="1140" y="270" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="280" font-weight="900" fill="#f1f3f5" opacity="0.02" select-none="true">01</text>

  <!-- Left Content Block -->
  <g transform="translate(60, 55)">
    <!-- Category Tag / Eyebrow -->
    <g transform="translate(0, 0)">
      <rect width="210" height="26" rx="4" fill="#3a2d18" stroke="#c5a059" stroke-width="0.8"/>
      <text x="105" y="17" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#e5cba3" letter-spacing="1.5">EDITORIAL MINIMALISM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#f1f3f5" letter-spacing="-1.5">babacan.me</text>

    <!-- Subtitle / Value Promise -->
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#a0a5ab">Systems Builder &amp; Full-Stack Developer Portfolio</text>

    <!-- Key Feature Badges -->
    <g transform="translate(0, 150)">
      <!-- React 19 -->
      <rect x="0" y="0" width="92" height="28" rx="4" fill="#1b1d20" stroke="#33373d" stroke-width="1"/>
      <text x="46" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#c5a059">React 19</text>

      <!-- TypeScript -->
      <rect x="102" y="0" width="108" height="28" rx="4" fill="#1b1d20" stroke="#33373d" stroke-width="1"/>
      <text x="156" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#f1f3f5">TypeScript</text>

      <!-- Vite+ -->
      <rect x="220" y="0" width="76" height="28" rx="4" fill="#1b1d20" stroke="#33373d" stroke-width="1"/>
      <text x="258" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#c5a059">Vite+</text>

      <!-- Three.js -->
      <rect x="306" y="0" width="94" height="28" rx="4" fill="#1b1d20" stroke="#33373d" stroke-width="1"/>
      <text x="353" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#f1f3f5">Three.js</text>

      <!-- Tailwind v4 -->
      <rect x="410" y="0" width="112" height="28" rx="4" fill="#1b1d20" stroke="#33373d" stroke-width="1"/>
      <text x="466" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#c5a059">Tailwind v4</text>
    </g>

    <!-- Call to Action / Status -->
    <g transform="translate(0, 215)">
      <circle cx="8" cy="8" r="4" fill="#10b981"/>
      <circle cx="8" cy="8" r="8" fill="#10b981" opacity="0.2"/>
      <text x="24" y="12" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#a0a5ab">Live at <tspan fill="#e5cba3" font-weight="700">https://babacan.me</tspan></text>
    </g>
  </g>

  <!-- Right Visual Proof: WebGL Topology & Architecture Schematic -->
  <g transform="translate(680, 45)">
    <!-- Outer Card Frame -->
    <rect width="460" height="290" rx="8" fill="#151618" stroke="#33373d" stroke-width="1"/>
    
    <!-- Header Bar -->
    <rect width="460" height="32" rx="8" fill="#1b1d20"/>
    <circle cx="20" cy="16" r="4" fill="#f87171"/>
    <circle cx="34" cy="16" r="4" fill="#fbbf24"/>
    <circle cx="48" cy="16" r="4" fill="#34d399"/>
    <text x="230" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a0a5ab">WebGL 3D Topology + Vite+ Engine</text>

    <!-- Simulated WebGL Network Nodes -->
    <g transform="translate(40, 50)">
      <!-- Grid / Connection Lines -->
      <path d="M 50 60 L 150 40 L 260 90 L 370 50 M 150 40 L 180 140 L 260 90 M 50 60 L 110 170 L 180 140 M 180 140 L 300 170 L 370 50 M 260 90 L 330 130 L 300 170" stroke="#33373d" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>

      <!-- Glowing Accent Connectors -->
      <path d="M 150 40 L 260 90 L 180 140" stroke="#c5a059" stroke-width="2" fill="none" opacity="0.8"/>
      
      <!-- Nodes -->
      <!-- Node 1 -->
      <circle cx="50" cy="60" r="6" fill="#1b1d20" stroke="#a0a5ab" stroke-width="2"/>
      <!-- Node 2 (Primary) -->
      <circle cx="150" cy="40" r="8" fill="#c5a059" stroke="#e5cba3" stroke-width="2"/>
      <circle cx="150" cy="40" r="14" fill="#c5a059" opacity="0.25"/>
      <text x="150" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e5cba3" font-weight="600">Three.js</text>

      <!-- Node 3 -->
      <circle cx="260" cy="90" r="7" fill="#1b1d20" stroke="#c5a059" stroke-width="2"/>
      <text x="260" y="112" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c5a059">React 19</text>

      <!-- Node 4 -->
      <circle cx="370" cy="50" r="5" fill="#1b1d20" stroke="#a0a5ab" stroke-width="2"/>
      <!-- Node 5 -->
      <circle cx="110" cy="170" r="5" fill="#1b1d20" stroke="#a0a5ab" stroke-width="2"/>
      <!-- Node 6 -->
      <circle cx="180" cy="140" r="7" fill="#c5a059" stroke="#e5cba3" stroke-width="2"/>
      <text x="180" y="162" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e5cba3">Vite+ (vp)</text>

      <!-- Node 7 -->
      <circle cx="300" cy="170" r="6" fill="#1b1d20" stroke="#a0a5ab" stroke-width="2"/>
      <!-- Node 8 -->
      <circle cx="330" cy="130" r="5" fill="#1b1d20" stroke="#a0a5ab" stroke-width="2"/>
    </g>

    <!-- Bottom Status Panel -->
    <rect x="20" y="225" width="420" height="48" rx="6" fill="#1b1d20" stroke="#26282d" stroke-width="1"/>
    <text x="35" y="246" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f1f3f5"><tspan fill="#c5a059">$</tspan> vp check &amp;&amp; vp build</text>
    <text x="35" y="262" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">✓ 916 modules transformed · Built in 1.22s</text>
  </g>
</svg>
