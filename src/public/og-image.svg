<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#111214" />
  
  <!-- Subtle Radial Gradient Glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#111214" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#C5A059" opacity="0.1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Monogram Logo -->
  <rect x="100" y="100" width="120" height="120" rx="24" fill="none" stroke="#C5A059" stroke-width="4" />
  <text x="160" y="163" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="72" fill="#C5A059" text-anchor="middle" dominant-baseline="middle">B</text>

  <!-- Title -->
  <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="72" fill="#F1F3F5" letter-spacing="-1">Barış Salih Babacan</text>
  
  <!-- Subtitle -->
  <text x="100" y="460" font-family="'JetBrains Mono', monospace, system-ui" font-weight="500" font-size="32" fill="#C5A059" letter-spacing="4">SOFTWARE ENGINEER · SYSTEMS ARCHITECT</text>

  <!-- Decorative line -->
  <line x1="100" y1="520" x2="1100" y2="520" stroke="#C5A059" stroke-width="1" opacity="0.3" />

  <!-- Website URL -->
  <text x="1100" y="570" font-family="'JetBrains Mono', monospace, system-ui" font-weight="400" font-size="24" fill="#A0A5AB" text-anchor="end">babacan.me</text>
</svg>
