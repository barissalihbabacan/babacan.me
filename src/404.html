<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />

    <title>404 — Page Not Found | babacan.me</title>

  <body>
    <!-- Top Navigation Bar -->
    <nav
      class="fixed top-0 w-full h-16 z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-white/5"

      <div

      >

      <div class="aurora-blob w-[320px] h-[320px] bg-tertiary-container -bottom-10 left-1/3"></div>
      <div class="text-center max-w-2xl mx-auto relative z-10">
        <div
          class="font-label-mono text-label-mono text-secondary uppercase tracking-widest mb-6 block"
        >
          Error 404
        </div>
        <h1
          class="font-display-lg-mobile md:font-display-lg text-[120px] md:text-[180px] leading-none mb-2"
        >
          <span class="text-gradient-aurora">404</span>
        </h1>
        <h2
          class="font-display-lg-mobile text-display-lg-mobile mb-6 leading-tight text-on-surface"
        >
          Page Not Found.
        </h2>
        <p class="font-body-lg text-body-lg text-on-surface-variant mb-12 max-w-xl mx-auto">

        </p>
        <div class="flex flex-wrap justify-center gap-4">
          <a
            class="btn-gradient px-8 py-4 font-label-mono text-label-mono uppercase tracking-widest rounded-lg flex items-center gap-3"
            href="/"
          >
            <span class="material-symbols-outlined text-sm">arrow_back</span>
            Back to Home
          </a>
          <a
            class="border border-tertiary/50 text-tertiary px-8 py-4 font-label-mono text-label-mono uppercase tracking-widest hover:bg-tertiary/10 transition-all"
            href="/contact.html"
          >
            Contact
          </a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer
      class="w-full py-section-gap bg-surface-container-lowest border-t border-outline-variant/20"
    >
      <div
        class="flex flex-col md:flex-row justify-between items-center px-margin-desktop max-w-container-max mx-auto gap-8"
      >
        <div class="font-headline-md text-headline-md text-gradient font-bold">babacan.me</div>
        <div class="flex gap-8 font-label-mono text-label-mono">
          <a
            class="text-on-surface-variant hover:text-primary transition-colors"
            href="https://github.com/barissalihbabacan"
            >GitHub</a
          >
          <a
            class="text-on-surface-variant hover:text-secondary transition-colors"
            href="https://linkedin.com/in/barissalihbabacan"

          >
          <a class="text-on-surface-variant hover:text-tertiary transition-colors" href="#"

          >
          <a
            class="text-on-surface-variant hover:text-primary transition-colors"
